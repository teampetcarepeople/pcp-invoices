<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetCare People Invoice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
<button id="download-btn">
    ⬇ Download PDF
</button>
<div class="invoice">

    <header class="header">

    <div class="brand">

        <img src="logo.png" class="logo">

    </div>

    <div class="invoice-header">

        <p class="eyebrow">INVOICE</p>

        <h1 id="invoice-number"</h1>

        <div class="invoice-meta">

            <div class="meta-item">

                <span>Date</span>

<strong id="invoice-date"></strong>
            </div>

        </div>

    </div>

</header>

    <section class="card client-card">

    <div class="section-title">
        BILL TO
    </div>

<h2 id="client-name"></h2>
    <p class="pets">
Parent of <span id="pets"></span>    </p>

    <div class="client-grid">

        <div>

            <label>Phone</label>

<p id="phone"></p>
        </div>

        <div>

            <label>Address</label>

<p id="address"></p>
        </div>

    </div>

</section>

    <section class="services">

    <table class="service-table">

        <thead>

<tr>

    <th>Service</th>

    <th>Base Price</th>

    <th>Units</th>

    <th>Night Charge</th>

    <th>Total</th>

</tr>

</thead>

        <tbody id="services-body">

</tbody>

    </table>

</section>

    <section class="totals">

    <div class="totals-card">

        <div class="total-row">

            <span>Subtotal</span>

<strong id="booking-line-total"></strong>
        </div>

        <div class="total-row" id="additional-charge-row">

    <span>Additional Charges</span>

<strong id="additional-charges"></strong>
</div>

<div class="charge-note" id="charge-note-row">

<span id="additional-charge-notes"></span>
</div>

        <div class="total-row" id="discount-row">

            <span>Discount</span>

<strong id="manual-discount"></strong>
        </div>

        <hr>

        <div class="grand-total">

    <div class="grand-total-label">

        TOTAL DUE

    </div>

<div class="grand-total-value" id="grand-total"></div>
    </div>

</div>

</section>

   <section class="payment-section">

    <div class="payment-divider"></div>

    <div class="payment-content">

        <div class="payment-info">

            <div class="section-title">
                PAYMENT DETAILS
            </div>

            <p class="payment-help">
                Scan the QR code or send payment via UPI
            </p>

            <h3>+91 62818 44132</h3>

        </div>

        <img
    src="upi-qr.png"
    alt="Scan to Pay"
    class="payment-qr"
/>

    </div>

</section>

    <footer>

<p>

Thank you for trusting PetCare People with your furry family ❤️

</p>

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
